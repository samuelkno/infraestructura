options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { any; };
    allow-query { any; };
    recursion no;
    // Default global policy: no transfers allowed.
    allow-transfer { none; };
};

// Zona INTENCIONALMENTE vulnerable para el laboratorio:
// allow-transfer { any; } permite que cualquier cliente haga un AXFR completo.
zone "lab.local" {
    type primary;
    file "/var/lib/bind/db.lab.local";
    allow-transfer { any; };
};
